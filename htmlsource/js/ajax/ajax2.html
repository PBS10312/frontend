<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }
      .container {
        display: flex;
        background: lightblue;
        height: 50px;
        justify-content: center;
        align-items: center;
      }
      .container li {
        list-style: none;
        margin: 0 10px;
        width: 25%;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <ul class="container">
      <li>메뉴1</li>
      <li>메뉴2</li>
      <li>메뉴3</li>
      <li>메뉴4</li>
    </ul>
    <div></div>
    <script>
      // 메뉴1 클릭 시 서버로 요청
      document.querySelector("li").addEventListener("click", () => {
        fetch("https://PBS10312.github.io/data/data.txt")
          .then((res) => {
            if (!res.ok) throw new Error("경로를 확인해 주세요");
            return res.text();
          })
          .then((data) => {
            console.log(data);
            document.querySelector("div").innerHTML = data;
          });
      });
      // 메뉴2 클릭 시 서버로 요청
      document.querySelector("ul li:nth-child(2)").addEventListener("click", () => {
        fetch("https://PBS10312.github.io/data/version.json")
          .then((res) => {
            if (!res.ok) throw new Error("경로를 확인해 주세요");
            return res.json();
          })
          .then((data) => {
            console.log(data);
            console.log(data.codename);
            let result = `<ul>`;
            result += `<li>version : ${data.version}<li>`;
            result += `<li>codename : ${data.codename}<li>`;
            result += `<ul>`;
            document.querySelector("div").innerHTML = result;
          });
      });
    </script>
  </body>
</html>
