<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>상품 주문서</h1>
    <form action="" method="get">
    <fieldset>
        <legend>개인정보</legend>
        <ul>
            <li>
                <label for="">이름</label>
                <input type="text" name="" id="" placeholder="여백없이입력">
            </li>
            <li>
                <label for="">연락처</label>
                <input type="text" name="" id="" placeholder="연락가능한번호">
            </li>
         
        </ul>
    </fieldset>
    <fieldset>
        <legend>배송지 정보</legend>
        <ul>
            <li>
                <label for="addr">주소</label>
                <input type="text" name="addr" id="" placeholder="">
            </li>
            
            <li>
                <label for="phone">전화번호</label>
                <input type="text" name="phone" id="" placeholder="">
            </li>
            <li>
                <label for="memo">메모</label>
                <textarea name="memo" id="" rows="5" cols="50"></textarea>
            </li>
        </ul>
    </fieldset>
    <fieldset>
        <legend>주문 정보</legend>
        <ul>
            <li>
                <input type="checkbox" name="order" id="" value="">
                <label for="order">과테말라 안티구아<sub>(100g)</sub></label>
                <input type="number" max="9999" min="0"  placeholder="0"/>개
                
            </li>
            <li>
                <input type="checkbox" name="order" id="" value="" >
                <label for="order">인도네시아 만델링<sub>(100g)</sub></label>
                <input type="number" max="9999" min="0"  placeholder="0"/>개
            </li>
            <li>
                <input type="checkbox" name="order" id="" value="">
                <label for="order">탐라는도다(블렌딩)<sub>(100g)</sub></label>
                <input type="number"  max="9999" min="0"  placeholder="0"/>개
            </li>
        </ul> 
    </fieldset>
    <div> 
        <input type="submit" value="주문하기">
        <input type="reset" value="다시작성">
        <button type="button">버튼</button>
        <button type="submit">submit</button>
        <button type="reset">reset</button>
    </div>
</form>
</body>
</html>
