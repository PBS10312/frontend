<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    
    non-semantic : div , span
    semantic : img , table , article , header , aside , footer , nav , section... 
    -->
    <!-- 상단 작성 시 -->

    <!-- 예전 방식 -->
    <div id="header">
        <h1>Header</h1>
    </div>

    <!-- 요즘 방식 -->
    <header>
        <h1>Header</h1>
    </header>
    <nav>
        <!-- navigation -->
    </nav>

    <!--  
        요소 배치
        1) 인라인 : img , a , b , stron , input, textarea, select(한 행을 나눠씀 그래서 옆으로 붙음)
        2) 블럭 : header , h1 , div ,ul , li , ol ,table(한 행을 다씀)
    -->
    <img src="../image/sudal.jpg" alt="">
    <img src="../image/sudal.jpg" alt="">
    <img src="../image/sudal.jpg" alt="">

    <input type="text" name="" id="">
    <input type="radio" name="" id="">
    <textarea name="" id=""></textarea>
    <select name="" id=""></select>
    <div>
        <input type="text" name="" id="">
    </div>
</body>
</html>
